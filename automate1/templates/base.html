{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>Wizard Dashboard</title>
    <!-- <link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css' rel='stylesheet'> -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link rel="stylesheet" href="{% static 'bootstrap-5.3.8-dist/css/bootstrap.min.css'%}">
    <link rel="stylesheet" href="{% static 'bootstrap-icons-1.13.1/font/bootstrap-icons.min.css'%}">
    <link rel="stylesheet" href="{% static 'jquery-ui-1.14.1/jquery-ui.css'%}">
    <!-- Local Select2 CSS -->
     
    <link href="{% static 'dist/css/select2.min.css'%}" rel="stylesheet" />


    <style>
        body {
            font-family: Segoe UI, Tahoma, sans-serif
        }

        .top {
            background: #2f7dd8;
            height: 56px;
            color: #fff
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #0d6efd;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .module {
            padding: 25px;
            text-align: center
        }

        .rectangle {
            width: 78px;
            height: 78px;
            border: 1px solid #cfcfcf;
            border-radius: 10%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 34px;
            color: #2f7dd8;
            transition: .2s
        }

        .rectangle:hover {
            background: #2f7dd8;
            color: #fff;
            transform: translateY(-3px)
        }

        .module h4 {
            margin-top: 18px;
            font-size: 20px
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <nav class='top d-flex justify-content-between align-items-center px-4'>
            <div><i class='bi bi-list fs-2'></i></div>
            <a href="{% url 'dashboard' %}">

                <div class='fw-bold fs-3 text-light'>WIZARD CLOUD</div>
            </a>
            <div class='d-flex align-items-center gap-3'><span>JOSIAH. agvision.</span>
                <div class='icon-btn'><i class='bi bi-headset'></i></div>
                <div class='icon-btn'><i class='bi bi-cart'></i></div>
                <div class='icon-btn'><i class='bi bi-bell'></i></div>
                <div class='icon-btn'><i class='bi bi-hand-thumbs-up'></i></div>
                <div class='icon-btn'>En</div>
                <div class='icon-btn'><i class='bi bi-plus-lg'></i></div>
                <div class='icon-btn'><i class='bi bi-person'></i></div>
            </div>
        </nav>



        <!-- Main Menu area End-->
        {% block content %}

        {% endblock content %}

        <!-- <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> -->
        <!-- End Footer area-->
        <!-- jquery
		============================================ -->
        <script src="{% static 'js/jquery-3.7.1.min.js'%}"></script>
        <!-- bootstrap JS
		============================================ -->
        <script src="{% static 'js/bootstrap.min.js'%}"></script>
        <!-- wow JS -->


        <script src="{% static 'js/script.js'%}"></script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
            <!-- jQuery (Required by Select2) -->
        <script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>

        <!-- Local Select2 JS -->
        <script src="{% static 'dist/js/select2.min.js' %}"></script>
        <script>
            document.getElementById('supplier_select').addEventListener('change', function () {
                // 1. Get the selected option element
                const selectedOption = this.options[this.selectedIndex];

                // 2. Extract the address from the data-address attribute
                const address = selectedOption.getAttribute('data-address');

                // 3. Set the value of the textarea
                document.getElementById('supplier_address').value = address ? address : '';
            });

        </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css' rel='stylesheet'>
    <style>
        body {
            margin: 0;
            font-family: Segoe UI, Tahoma, sans-serif;
            overflow: hidden
        }

        .top {
            height: 56px;
            background: #2f7dd8;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: 700
        }

        .main {
            display: flex;
            height: calc(100vh - 56px)
        }

        .left {
            flex: 2;
            position: relative
        }

        .w {
            position: absolute;
            left: -60px;
            top: -40px;
            font-size: 900px;
            line-height: .8;
            color: #2aa0d6;
            font-family: cursive
        }

        .right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center
        }

        .card {
            border: 0;
            width: 420px
        }

        .footer {
            text-align: center;
            color: #2f73d8;
            font-weight: 600;
            margin-top: 40px
        }
    </style>
</head>

<body>
    <div class="container-fluid">
    <div class='top'>WIZARD CLOUD</div>
    <div class='main'>
        <div class='left'>
            <div class='w'>W</div>
        </div>
        <div class='right'>
            <div class='card'>
                <h1 class='text-center fw-bold mb-5'>WELCOME</h1>
                <h3 class='text-center mb-4'>USER LOGIN</h3>
                <div class='mb-3'><label>User ID *</label><input class='form-control form-control-lg'
                        value='JOSIAH.agvision.agvision'></div>
                <div class='mb-3'><label>Password *</label><input type='password' class='form-control form-control-lg'
                        value='12345'></div>
                <div class='d-flex justify-content-between mb-5'><label><input type='checkbox'> Remember me</label><a
                        href='#'>Forgot my password</a></div>
                <div class='text-center'><button class='btn btn-outline-primary btn-lg'><i
                            class='bi bi-person-fill'></i> Login</button></div>
                <div class='footer'>Anytime • Anywhere • Any Device</div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>

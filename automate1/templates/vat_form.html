{% extends 'base.html' %}
{% block content %}

<div class="container w-50 mt-4">

    <div class="card">

        <div class="card-header text-dark">
            <h4>Add VAT</h4>
        </div>
        <div class="card-body">
            <form method="POST" action="{% url 'vat_create' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label>VAT Name</label>
                    <input type="text" name="name" class="form-control">
                </div>
                <input type="submit" class="btn btn-success"
                    value="Save"/>
            </form>
        </div>
    </div>
</div>

{% endblock %}
